name: Test Self-Hosted Runner (Safe)

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Basic PowerShell Test
        shell: powershell
        run: |
          Write-Host "Hello from Samir's PC"
          Write-Host "Runner is executing PowerShell successfully"
          Write-Host "Current directory:"
          Get-Location
          Write-Host "Listing files:"
          Get-ChildItem
